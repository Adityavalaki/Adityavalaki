name: Profile stats

on:
  schedule:
    - cron: '7 * * * *'   # hourly, at :07 past each hour
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/**']

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Draw stats cards
        run: node .github/scripts/stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git add assets/stats-light.svg assets/stats-dark.svg
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update profile stats"
          git push
